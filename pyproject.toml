[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vox-windows-agent"
version = "0.1.0"
description = "Native foundation for the Vox Windows agent"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
ui = ["PySide6>=6.7,<6.9"]
voice = ["sounddevice>=0.5,<0.6"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
include = ["vox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["desktop: tests requiring a disposable Windows desktop"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["vox"]

[tool.setuptools.package-data]
"vox.ui" = ["qml/*.qml"]
