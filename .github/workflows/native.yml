name: Native foundation
on: [push, pull_request]
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,ui]" "pytest-timeout>=2.3,<3"
      - run: python -m pytest -m "not desktop" --timeout=30 --timeout-method=thread
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          VOX_REQUIRE_UI_TESTS: "1"
      - run: python -m ruff check vox tests scripts/capture_native_ui.py
      - run: python -m ruff format --check vox tests scripts/capture_native_ui.py
      - run: python -m mypy
