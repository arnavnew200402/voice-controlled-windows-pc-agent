name: Windows Groq voice installer
on:
  push:
    branches:
      - 'arena/32bc43fd-voice-controlled-windows-pc-ag'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,voice]" "PySide6-Essentials==6.8.3" "pyinstaller>=6.11,<7"
      - name: Download offline wake-word model (bundled; no first-run download)
        shell: pwsh
        run: |
          $zip = "vosk-model-small-en-us-0.15.zip"
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/$zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath wake-model -Force
          if (!(Test-Path "wake-model/vosk-model-small-en-us-0.15/am")) { throw "Wake-word model layout unexpected" }
      - name: Build application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'continue'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --disable-windowed-traceback --name VoxGroq --paths . --collect-all vosk --add-data "vox/ui/qml;vox/ui/qml" --add-data "vox/engine/prompts;vox/engine/prompts" --add-data "wake-model;vox/wake-model" scripts/windows_entry.py 2>&1 | Tee-Object -FilePath pyinstaller-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content pyinstaller-output.txt -Tail 100
            for ($i = 0; $i -lt $lines.Count; $i += 25) {
              $end = [Math]::Min($i + 24, $lines.Count - 1)
              $chunk = ($lines[$i..$end] -join "`n")
              $escaped = $chunk -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Host ('::error title=PyInstaller failure tail part ' + ([int]($i / 25) + 1) + '::' + $escaped)
            }
          }
          exit $code
      - name: Keep only the standard x64 PortAudio runtime
        shell: pwsh
        run: |
          $dir = "dist/VoxGroq/_internal/_sounddevice_data/portaudio-binaries"
          if (!(Test-Path "$dir/libportaudio64bit.dll")) { throw "PortAudio runtime missing" }
          Get-ChildItem $dir -Filter '*.dll' | Where-Object { $_.Name -ne 'libportaudio64bit.dll' } | Remove-Item -Force
      - name: Add third-party notices
        run: python scripts/collect_preview_licenses.py
      - name: Smoke-test packaged app
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/VoxGroq/VoxGroq.exe" -ArgumentList "--smoke-test" -PassThru
          if (!$p.WaitForExit(90000)) { $p.Kill(); throw "Packaged smoke test timed out" }
          if (Test-Path vox-smoke-test.txt) { Get-Content vox-smoke-test.txt }
          if ($p.ExitCode -ne 0) { throw "Packaged app smoke test failed ($($p.ExitCode))" }
          if (!(Test-Path vox-smoke-test.txt)) { throw "No smoke test result was created" }
          Remove-Item vox-smoke-test.txt
      - name: Build per-user Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc installer/vox-preview.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Install and smoke-test in runner temporary directory
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        shell: pwsh
        run: |
          $setup = Resolve-Path "dist/installer/Vox-Groq-Setup.exe"
          $target = Join-Path $env:RUNNER_TEMP "VoxGroqTest"
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer failed ($($p.ExitCode))" }
          $p = Start-Process -FilePath (Join-Path $target 'VoxGroq.exe') -ArgumentList '--smoke-test' -PassThru
          if (!$p.WaitForExit(90000)) { $p.Kill(); throw "Installed smoke test timed out" }
          if (Test-Path vox-smoke-test.txt) { Get-Content vox-smoke-test.txt }
          if ($p.ExitCode -ne 0 -or !(Test-Path vox-smoke-test.txt)) { throw "Installed app smoke test failed" }
      - name: Generate checksum and copy readme
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/installer/Vox-Groq-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Vox-Groq-Setup.exe" | Out-File dist/installer/SHA256SUMS.txt -Encoding ascii
          Copy-Item installer/README.txt dist/installer/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vox-windows-groq-early-access
          path: dist/installer/
          if-no-files-found: error
          retention-days: 30
